spring:
  data:
    redis:
      port: 6379
      host: localhost
      topic: "follower_topic"
      channel:
        follower: follower_channel
        achievement: achievement_channel

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com #https://www.baeldung.com/spring-email
    password: whatever #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

server:
  port: 8083

logging:
  level:
    root: info
    feign: DEBUG
    feign.Logger: WARN
    feign.hystrix: WARN

    org:
      springframework:
        cloud:
          openfeign: DEBUG

    org.apache.http: DEBUG
    okhttp3: DEBUG

    feign.template: OFF

#Можно зарегистрировать аккаунт без привязки карты. Будет 2 евро на отправку тестовых SMS
vonage: #https://dashboard.nexmo.com/getting-started/sms
  api:
    key: whatever
    secret: whatever

project-service:
  host: localhost
  port: 8082
user-service:
  host: localhost
  port: 8080

sms:
  url: "http://api.prostor-sms.ru/"
