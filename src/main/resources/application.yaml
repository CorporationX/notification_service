spring:
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel

  kafka:
    topics:
      follower-events: follower_events
    bootstrap-servers: localhost:9092
    consumer:
      properties:
        spring.json.trusted.packages: "*"
    listener:
      missing-topics-fatal: false
    admin:
      auto-create: true
    bindings:
      follower-events:
        consumer:
          dlq-name: follower_events_dlq
          dlq-partitions: 1

  cache:
    type: caffeine

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: whatever
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages
    encoding: UTF-8

