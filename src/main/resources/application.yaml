spring:
  application:
    name: notification-service
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel

  # Kafka вместо Redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # при необходимости: максимальный размер, опции ретраев и т.д.
        max.poll.interval.ms: 300000 # 5 минут
        max.poll.records: 100
    listener:
      ack-mode: record

# Топики приложения (Kafka)
app:
  topics:
    follower: ${TOPIC_FOLLOWER:follower}
    achievement: ${TOPIC_ACHIEVEMENT:achievement}
  locale:
    default: en
    new-follower: en

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME:} #https://www.baeldung.com/spring-email
    password: ${SMTP_PASSWORD:} #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

server:
  port: 8083

logging:
  level:
    root: info
    faang.school.notificationservice: debug

#Можно зарегистрировать аккаунт без привязки карты. Будет 2 евро на отправку тестовых SMS
vonage: #https://dashboard.nexmo.com/getting-started/sms
  api:
    key: ${VONAGE_API_KEY:beb56a84}
    secret: ${VONAGE_API_SECRET:0gj1KiEBtRzJ41Gc}
  from: ${VONAGE_FROM:FaangSchool}
  enabled: ${VONAGE_ENABLED:true}
  defaultCountry: ${VONAGE_DEFAULT_COUNTRY:RU}

project-service:
  host: localhost
  port: 8082
user-service:
  host: localhost
  port: 8080

