spring:
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel
        profile: profile_channel

  mail:
    host: smtp.gmail.com
    port: 587
    #Для тестирования необходимо настроить гугл аккаунт и определить системные переменные
    username: ${EMAIL_USERNAME} #https://www.baeldung.com/spring-email
    password: ${EMAIL_PASSWORD} #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
email:
  subject: "Notification Email Subject"
  messages:
    basename: messages

server:
  port: 8083
  servlet:
    context-path: /notifications/api/

