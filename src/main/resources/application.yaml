spring:
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel

  kafka:
    consumer:
      enable-auto-commit: false
      isolation-level: "read-committed"
      auto.offset.reset: "latest"

      topics:
        premium:
          bought-topic: "premium-bought-topic"
          expired-topic: "premium-expired-topic"
          expire-soon-topic: "premium-expire-soon-topic"
          auto-renew-failed-topic: "premium-auto-renew-failed-topic"
          updated-topic: "premium-updated-topic"
          payment-failed-topic: "premium-payment-failed-topic"

      groups:
        premium:
          premium-bought-group: "premium-bought-group"
          expired-group: "premium-expired-group"
          expire-soon-group: "premium-expire-soon-group"
          auto-renew-failed-group: "premium-auto-renew-failed-group"
          updated-group: "premium-updated-group"
          payment-failed-group: "premium-payment-failed-group"

    listener:
      ack-mode: "manual"

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com #https://www.baeldung.com/spring-email
    password: whatever #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

server:
  port: 8083

logging:
  level:
    root: info

#Можно зарегистрировать аккаунт без привязки карты. Будет 2 евро на отправку тестовых SMS
vonage: #https://dashboard.nexmo.com/getting-started/sms
  api:
    key: whatever
    secret: whatever

project-service:
    host: localhost
    port: 8082
user-service:
    host: localhost
    port: 8080
