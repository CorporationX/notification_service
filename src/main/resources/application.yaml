spring:
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
    topics:
      notification: "notification-topic"

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com # https://www.baeldung.com/spring-email
    password: whatever # сгенерировать через https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

redis:
  channel:
    follower: follower_channel
    achievement: achievement_channel

server:
  port: 8083

logging:
  level:
    root: info

vonage: # https://dashboard.nexmo.com/getting-started/sms
  api:
    key: whatever
    secret: whatever

project-service:
  host: localhost
  port: 8082

user-service:
  host: localhost
  port: 8080

post-service:
  host: localhost
  port: 8081

telegrambots:
  bots:
    - username: ${TELEGRAM_BOT_USERNAME}
      token: ${TELEGRAM_BOT_TOKEN}
      path: ""

