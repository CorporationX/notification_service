spring:
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel
        like: notification_like_channel
        failed-sms-message: failed_sms_message_channel
        comment: comment_channel
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com #https://www.baeldung.com/spring-email
    password: whatever #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

  telegram:
    bot:
      username: corpnotification_bot
      token: 8175053802:AAGhCg2Mgm4RwATkeqOUzzkQz9xlmxk9Wyg

server:
  port: 8083

logging:
  level:
    root: info
    io.github.resilience4j.retry: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG

#Можно зарегистрировать аккаунт без привязки карты. Будет 2 евро на отправку тестовых SMS
vonage: #https://dashboard.nexmo.com/getting-started/sms
  api:
    key:
    secret:
  brand-number: "Vonage APIs"
  callback-uri: https://valid-muskox-casual.ngrok-free.app/api/v1/webhooks/vonage/delivery-receipt #это урл для приема отчетов об отправке от Vonage. юзайте ngrok если хотите потестить

project-service:
  host: localhost
  port: 8082
user-service:
  host: localhost
  port: 8080

resilience4j:
  retry:
    instances:
      default-retry:
        max-attempts: 3
        wait-duration: 200ms
        exponential-backoff-multiplier: 2.0
        retry-exceptions:
          - com.vonage.client.VonageClientException

  circuitbreaker:
    instances:
      default-circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3

thread-pool:
  sms-message-pool:
    name: "smsMessagePool"
    num-of-threads: 5

messages:
  keys:
    like-post: like.post
    comment-post: comment.post

snowflake:
  worker-id: 1
  datacenter-id: 1