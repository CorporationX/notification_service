spring:
  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=notification_service
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com #https://www.baeldung.com/spring-email
    password: whatever #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  sms:
    exolve:
      url: https://api.exolve.ru/messaging/v1/SendSMS
      connectionTimeoutSeconds: 10
      readTimeoutSeconds: 10
      authorizationString: ${SMS_AUTH_KEY}
      sourcePhoneNumber: ${SMS_SOURCE_PHONE}

  messages:
    basename: messages

  config:
    import: classpath:kafka-topics.yaml

  kafka:
    consumer:
      group-id: "notification-group"
      bootstrap-servers: "localhost:9092"
      retry-interval-ms: 5000
      max-attempts: 5
    producer:
      bootstrap-servers: "localhost:9092"

cleanup:
  job:
    cron: "0 0 3 * * *" # at 03:00 every day
    hours-interval: 24

server:
  port: 8083

logging:
  level:
    root: info

#Можно зарегистрировать аккаунт без привязки карты. Будет 2 евро на отправку тестовых SMS
vonage: #https://dashboard.nexmo.com/getting-started/sms
  api:
    key: whatever
    secret: whatever

project-service:
  host: localhost
  port: 8082
user-service:
  host: localhost
  port: 8080
