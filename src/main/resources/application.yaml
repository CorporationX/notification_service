spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      user-service:
        group-id: user-service-group
      post-service:
        group-id: post-service-group
    topics:
      goal-completed-topic:
        name: goal-completed
      subscription:
        new-follower-topic:
          name: new-follower-events
        unfollow-topic:
          name: unfollow-events
      event-start-topic:
        name: event-start
      like:
        post-liked-topic:
          name: post-liked-event
        comment-liked-topic:
          name: comment-liked-event

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel
    kafka:
      bootstrap-servers: localhost:9092

