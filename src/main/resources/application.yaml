spring:
  data:
    redis:
      port: 6379
      host: localhost
      topics:
        follower: follower_topic
        achievement: achievement_topic
        mentorshipAccepted: mentorship_accepted_topic

  kafka:
    consumer:
      bootstrapServers: localhost:9092,localhost:9093,localhost:9094
      groupId: not-service
      trustedPackages: ""
      topics:
        writerAchieved: writer_achieved_topic

  mail:
    host: smtp.gmail.com
    port: 587
    username:  #https://www.baeldung.com/spring-email ваша почта
    password:  #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    transport:
      protocol: smtp
    properties:
        smtp:
          auth: true
          starttls:
            enable: true
          debug: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

server:
  port: 8083

logging:
  level:
    root: info

#Можно зарегистрировать аккаунт без привязки карты. Будет 2 евро на отправку тестовых SMS
vonage: #https://dashboard.nexmo.com/getting-started/sms
  api:
    key: whatever
    secret: whatever

project-service:
    host: localhost
    port: 8082

user-service:
    host: localhost
    port: 8080

telegram:
  username: "YOUR_TELEGRAM_BOT_USERNAME"
  token: "YOUR_TELEGRAM_BOT_TOKEN" # МОЖНО СОЗДАТЬ/ВЗЯТЬ В Botfather (вбейте в поиск в телеграмме)
  timeout: 5000

retry:
  attempts: 3
  delay: 2000