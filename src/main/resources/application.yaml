spring:
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        followerChannel: follower_channel
        achievementChannel: achievement_channel
        recommendationReceivedChannel: recommendation_event_channel
        mentorshipAcceptedEventChannel: mentorship-accepted-channel
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: smtp.gmail.com
    port: 587
    username: example@gmail.com #https://www.baeldung.com/spring-email
    password: password #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
    producer:
      acks: "1"
    topics:
      hashtag-notification:
        name: "hashtag-notification"
        partitions: 3
        replicas: 1

  profiles:
    active: local

