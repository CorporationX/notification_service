spring:
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel
  config:
    import: optional:file:.env.properties
  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com #https://www.baeldung.com/spring-email
    password: whatever #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

server:
  port: 8083

logging:
  level:
    root: info


project-service:
  host: localhost
  port: 8082
notification-service:
  api-version: /api/v1
  sms:
    enabled: false
    vonage:
      api-key: ${VONAGE_API_KEY}
      api-secret: ${VONAGE_SECRET_API_KEY}
  telegram-bot:
    token: ${TELEGRAM_TOKEN}
    username: "MyFaangNotificationBot"
  redis:
    achievement-channel: achievement_channel
user-service:
    host: localhost:8080/api/v1
