spring:
  data:
    redis:
      port: 6379
      host: localhost
      channels:
        follower: follower_channel
        achievement: achievement_channel
        like_post: like_post_channel

  mail:
    host: smtp.gmail.com
    port: 587
    username: <your email>
    password: <your apikey for application>
    subject: "Notification service"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        transport:
          protocol: smtp

  messages:
    basename: messages

server:
  port: 8083

logging:
  level:
    root: info

