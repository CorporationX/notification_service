spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: user-service-group
    topics:
      goal-completed-topic:
        name: goal-completed
      subscription:
        new-follower-topic:
          name: new-follower-events
        unfollow-topic:
          name: unfollow-events
      profile:
        name: view-profile
      recover:
        name: transfer-events-dlt
      event-start-topic:
        name: event-start
      comment-created-topic:
        name: comment-created-notification
      post-liked-topic:
        name: post-liked-event
      comment-liked-topic:
        name: comment-liked-event

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: user
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel

  mail:
