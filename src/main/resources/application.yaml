spring:
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel

  config:
    import: 'optional:consul:'
  application:
    name: notification-service
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery: notification-service-i1
      config:
        enabled: true
        watch:
          enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: hydra.stream10.faang.school@gmail.com #https://www.baeldung.com/spring-email
    password: ojkpqwcbnebijjlj #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-subject: "Hydra notification"
    template-name: notification-template.ftl

  messages:
    basename: messages

  kafka:
    retry:
      attempts: 3
      backoff-delay: 1000 # 1 секунда
    consumer:
      bootstrap-servers: localhost:9092, localhost:9094
      group-id: notification-service
      max-poll-records: 50
      offset-reset-config: latest
    topics:
      recommendation-request:
        name: recommendation-request-topic
        concurrency: 4
      request:
        name: request-event-topic
        concurrency: 3

  freemarker:
    template-loader-path: classpath:/templates/
    suffix: .ftl
    charset: UTF-8

server:
  port: 8083

logging:
  level:
    root: info

#Можно зарегистрировать аккаунт без привязки карты. Будет 2 евро на отправку тестовых SMS
vonage: #https://dashboard.nexmo.com/getting-started/sms
  api:
    key: whatever
    secret: whatever

services:
  user-service:
    name: user-service
  project-service:
    name: project-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,env,refresh

feign:
  retry:
    maxAttempts: 3
    delay: 1000
    multiplier: 2
