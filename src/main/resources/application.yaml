spring:

  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    topics:
      name:
        event-start-topic: "event_start_topic"
        mentorship-offered: "mentorship-offered"
    channel:
      follower: follower_channel
      achievement: achievement_channel

  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    consumer:
      topics:
        recommendation: "recommendation-topic"
        recommendation-request: "recommendation-request-topic"
      group-id:
        recommendation: "recommendation"
        recommendation-request: "recommendation-request"
      concurrency: 3
      trusted-package: "*dto*"

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com #https://www.baeldung.com/spring-email
    password: whatever #генерируем для своего Google аккаунта по инструкции https://support.google.com/accounts/answer/185833
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages

server:
  port: 8083

logging:
  level:
    root: info

#Можно зарегистрировать аккаунт без привязки карты. Будет 2 евро на отправку тестовых SMS
vonage: #https://dashboard.nexmo.com/getting-started/sms
  api:
    key: whatever
    secret: whatever
thread:
  min-thread: 4
  max-thread: 10
  queue-capacity: 100
  thread-name: "Thread-conf"
  ttl-thread: 60
  graceful-shutdown-flag: true
  await-termination-seconds: 30

project-service:
    host: localhost
    port: 8082
user-service:
    host: ${host}
    port: ${port}

telegram:
  token: "${BOT_TOKEN}"