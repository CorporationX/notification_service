name: Notification-Service CI

on:
  push:
    branches:
      - Dragon-master-stream7
  pull_request:
    branches:
      - Dragon-master-stream7

jobs:
  test-build:
    name: Test and Build Notification Service
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '17'
      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Project Application
        run: ./gradlew build