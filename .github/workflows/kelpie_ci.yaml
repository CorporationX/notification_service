name: Kelpie Notification Service CI

on:
  push:
    branches: [ "kelpie-master-stream10" ]
  pull_request:
    branches: [ "kelpie-master-stream10" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
        EXCLUDE_FROM_CONFIG: "org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Build with Gradle Wrapper
        run: ./gradlew assemble

  test:
    runs-on: ubuntu-latest
    env:
        EXCLUDE_FROM_CONFIG: "org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
      - name: Run tests with Gradle Wrapper
        run: ./gradlew test

  dependency-submission:
    runs-on: ubuntu-latest
    env:
        EXCLUDE_FROM_CONFIG: "org.telegram.telegrambots.longpolling.starter.TelegramBotStarterConfiguration"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582